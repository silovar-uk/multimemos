name: Import kakidas source

on:
  push:
    branches: [main]
    paths:
      - .run-kakidas-import

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout multimemos
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout source snapshot
        run: |
          git clone https://github.com/silovar-uk/kakidas.git /tmp/kakidas
          git -C /tmp/kakidas checkout a58fc411997e316905157a952c616b124fa2904d

      - name: Import deployable application
        run: |
          rm -rf src public supabase tests
          cp -a /tmp/kakidas/src ./src
          cp -a /tmp/kakidas/public ./public
          cp -a /tmp/kakidas/supabase ./supabase
          cp -a /tmp/kakidas/tests ./tests
          cp /tmp/kakidas/.gitignore ./.gitignore
          cp /tmp/kakidas/.npmrc ./.npmrc
          cp /tmp/kakidas/index.html ./index.html
          cp /tmp/kakidas/package.json ./package.json
          cp /tmp/kakidas/package-lock.json ./package-lock.json
          cp /tmp/kakidas/tsconfig.app.json ./tsconfig.app.json
          cp /tmp/kakidas/tsconfig.json ./tsconfig.json
          cp /tmp/kakidas/tsconfig.node.json ./tsconfig.node.json
          cp /tmp/kakidas/vercel.json ./vercel.json
          cp /tmp/kakidas/vite.config.ts ./vite.config.ts
          rm -f .migration-placeholder

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify production build
        run: npm run build

      - name: Commit imported source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "Import kakidas application source"
          git push origin main
