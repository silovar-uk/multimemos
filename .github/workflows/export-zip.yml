name: Export multimemos ZIP

on:
  push:
    branches: [main]
    paths:
      - .run-zip-export

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create clean ZIP
        run: |
          zip -r multimemos-main.zip . \
            -x '.git/*' \
               '.github/*' \
               '.run-zip-export' \
               'multimemos-main.zip'

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: multimemos-main-zip
          path: multimemos-main.zip
          if-no-files-found: error
