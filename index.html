<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="description" content="複数の文章を横に並べたまま、見比べながら書ける2〜4欄の軽量メモワークスペース。">
  <meta name="theme-color" content="#f0ede6">
  <title>MultiMemos</title>
  <link rel="icon" href="./favicon.svg?v=20260814" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css?v=20260815-14">
  <style>
    .pane-actions > .copy-all-action {
      width: auto;
      min-width: 74px;
      gap: 5px;
      padding: 0 8px;
      border-color: rgba(var(--pane-accent-rgb), 0.22);
      background: rgba(var(--pane-accent-rgb), 0.09);
      color: var(--ink);
    }
    .copy-all-action .copy-action-label {
      font-size: 9px;
      font-weight: 720;
      letter-spacing: 0.01em;
    }

    .shortcut-trigger {
      height: 22px;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 0 7px 0 5px;
      border: 1px solid transparent;
      border-radius: 5px;
      background: transparent;
      color: var(--muted);
      font-size: 7.5px;
      font-weight: 620;
      cursor: pointer;
    }
    .shortcut-trigger:hover,
    .shortcut-trigger[aria-expanded="true"] {
      border-color: var(--line);
      background: rgba(255,255,255,.54);
      color: var(--ink);
    }
    kbd {
      min-width: 26px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 2px 5px;
      border: 1px solid #c9c3b9;
      border-bottom-color: #aaa398;
      border-radius: 4px;
      background: #f7f4ed;
      box-shadow: 0 1px 0 rgba(34,31,27,.08);
      color: #5a554d;
      font-family: var(--font-mono);
      font-size: 8px;
      font-weight: 720;
      line-height: 1.15;
      white-space: nowrap;
    }
    .shortcut-palette {
      position: fixed;
      z-index: 95;
      left: 50%;
      bottom: 40px;
      width: min(560px, calc(100vw - 24px));
      transform: translateX(-50%);
    }
    .shortcut-card {
      overflow: hidden;
      border: 1px solid #bcb6ac;
      border-radius: 11px;
      background: rgba(255,254,250,.985);
      box-shadow: 0 18px 50px rgba(28,25,22,.18);
      backdrop-filter: blur(18px) saturate(120%);
      animation: shortcut-in 120ms ease-out;
    }
    @keyframes shortcut-in {
      from { opacity: 0; transform: translateY(5px) scale(.985); }
    }
    .shortcut-head {
      min-height: 43px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 9px 12px;
      border-bottom: 1px solid var(--line);
    }
    .shortcut-head strong {
      font-size: 11px;
      font-weight: 780;
      letter-spacing: -.02em;
    }
    .shortcut-head span {
      color: var(--muted);
      font-size: 8px;
    }
    .shortcut-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0;
    }
    .shortcut-group {
      min-width: 0;
      padding: 10px;
    }
    .shortcut-group:nth-child(odd) { border-right: 1px solid var(--line); }
    .shortcut-group:nth-child(n+3) { border-top: 1px solid var(--line); }
    .shortcut-label {
      display: block;
      margin: 0 4px 6px;
      color: var(--muted);
      font-size: 7px;
      font-weight: 760;
      letter-spacing: .09em;
      text-transform: uppercase;
    }
    .shortcut-list {
      display: grid;
      gap: 3px;
    }
    .shortcut-item {
      width: 100%;
      min-height: 34px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 5px 7px;
      border: 1px solid transparent;
      border-radius: 6px;
      background: transparent;
      color: var(--ink);
      font-size: 9px;
      text-align: left;
      cursor: pointer;
    }
    .shortcut-item:hover:not(:disabled),
    .shortcut-item:focus-visible {
      border-color: rgba(85,79,70,.16);
      background: var(--soft);
      outline: 0;
    }
    .shortcut-item:disabled {
      opacity: .32;
      cursor: default;
    }
    .shortcut-item span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .shortcut-note {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 8px 12px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 7.5px;
    }

    @container (max-width: 300px) {
      .pane-actions { padding-left: 0; }
    }
    @container (max-width: 176px) {
      .pane-actions > .copy-all-action {
        width: 27px;
        min-width: 27px;
        padding: 0;
      }
      .copy-all-action .copy-action-label { display: none; }
    }
    @media (max-width: 800px) {
      .shortcut-palette { bottom: 12px; }
      .shortcut-grid { grid-template-columns: 1fr; max-height: 68vh; overflow: auto; }
      .shortcut-group:nth-child(odd) { border-right: 0; }
      .shortcut-group:nth-child(n+2) { border-top: 1px solid var(--line); }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"><i>MM</i><small>04</small></span>
        <span class="brand-type">
          <strong>MultiMemos</strong>
          <small>PARALLEL NOTES</small>
        </span>
        <span class="brand-tagline">並べて、考える。</span>
      </div>

      <div class="layout-control desktop-layout-control">
        <span class="control-label">表示欄</span>
        <div class="layout-switch" aria-label="表示する欄数">
          <button type="button" data-layout="2">2欄</button>
          <button type="button" data-layout="3">3欄</button>
          <button type="button" data-layout="4">4欄</button>
        </div>
      </div>

      <div class="layout-control mobile-layout-control">
        <span class="control-label">1画面</span>
        <div class="layout-switch" aria-label="スマホで1画面に表示する欄数">
          <button type="button" data-mobile-columns="1">1欄</button>
          <button type="button" data-mobile-columns="2">2欄</button>
        </div>
      </div>

      <div class="global-actions">
        <a class="diff-link" href="https://silovar-uk.github.io/diff/" target="_blank" rel="noopener noreferrer" aria-label="外部ツールのDiffを新しいタブで開く" title="外部ツールのDiffを新しいタブで開きます">
          <span class="diff-symbol" aria-hidden="true">
            <svg class="icon" viewBox="0 0 24 24"><path d="M7 4v16M17 4v16M3 8h4M17 8h4M3 16h4M17 16h4"/></svg>
          </span>
          <span class="diff-copy"><strong>Diff</strong><small>外部</small></span>
          <svg class="external-icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M5 3h8v8M13 3 4 12"/></svg>
        </a>
        <div class="settings-wrap">
          <button type="button" id="settingsToggle" class="settings-toggle" aria-expanded="false" aria-controls="settingsPanel">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10M14 4v6M6 14v6"/></svg>
            <span>表示設定</span>
          </button>
          <div id="settingsPanel" class="settings-panel" hidden>
            <div class="settings-title">表示設定</div>
            <div class="settings-row">
              <span>文字サイズ</span>
              <div class="font-switch" aria-label="全体文字サイズ">
                <button type="button" id="fontDown" aria-label="文字を小さくする">−</button>
                <span><b id="fontValue">13</b>px</span>
                <button type="button" id="fontUp" aria-label="文字を大きくする">＋</button>
              </div>
            </div>
            <button type="button" id="compactToggle" class="settings-action" title="余白と行間を少し詰めて表示します">
              <span>コンパクト表示</span><span id="compactState">オフ</span>
            </button>
            <button type="button" id="equalize" class="settings-action" title="変更した各欄の幅を同じ幅に戻します">
              <span>欄幅を均等にする</span><span>実行</span>
            </button>
          </div>
        </div>
      </div>
    </header>

    <nav class="mobile-pager" aria-label="欄を移動">
      <button type="button" id="mobilePrev" aria-label="前の欄">‹</button>
      <div><span id="mobileCount">1 / 3</span><strong id="mobileTitle"></strong></div>
      <button type="button" id="mobileNext" aria-label="次の欄">›</button>
    </nav>

    <main id="workspace" class="workspace" aria-label="メモワークスペース"></main>

    <footer class="statusbar">
      <span id="saveState"><i></i> 自動保存済み</span>
      <button type="button" id="shortcutTrigger" class="shortcut-trigger desktop-only" aria-haspopup="dialog" aria-expanded="false" aria-controls="shortcutPalette">
        <kbd>Ctrl M</kbd><span>MultiMemos操作</span>
      </button>
    </footer>
  </div>

  <template id="paneTemplate">
    <section class="memo-pane">
      <span class="pane-accent" aria-hidden="true"></span>
      <header class="pane-header">
        <div class="pane-heading">
          <span class="pane-number" aria-hidden="true"></span>
          <span class="pane-color-dot" aria-hidden="true"></span>
          <input class="pane-title" type="text" aria-label="欄の名前">
        </div>
        <div class="pane-actions">
          <button type="button" data-action="lock" data-tooltip="固定" aria-label="この欄を固定" title="この欄を編集できない状態にします">
            <svg class="icon icon-unlocked" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 7.7-1.5"/></svg>
            <svg class="icon icon-locked" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
          </button>
          <button type="button" class="copy-all-action" data-action="copy" data-tooltip="全文コピー" aria-label="この欄の文章を全文コピー" title="この欄の文章を全文コピーします">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="11" height="11" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/><path class="copy-check" d="m11 14 2 2 4-5"/></svg>
            <span class="copy-action-label">全文コピー</span>
          </button>
          <button type="button" data-action="focus" data-tooltip="集中表示" aria-label="この欄を集中表示" title="この欄だけを大きく表示します">
            <svg class="icon icon-expand" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5"/></svg>
            <svg class="icon icon-collapse" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3v5H3M16 3v5h5M8 21v-5H3M16 21v-5h5"/></svg>
          </button>
          <details class="pane-more">
            <summary data-tooltip="欄設定" aria-label="欄設定" title="この欄の文字サイズや内容の消去を設定します">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h5M15 6h5M12 3v6M4 18h5M15 18h5M12 15v6M4 12h11M19 12h1M16 9v6"/></svg>
            </summary>
            <div class="pane-menu">
              <div class="pane-menu-row">
                <span>文字サイズ</span>
                <div class="pane-font-controls">
                  <button type="button" data-action="smaller" title="この欄の文字を小さくします">−</button>
                  <span class="pane-font-value"></span>
                  <button type="button" data-action="larger" title="この欄の文字を大きくします">＋</button>
                </div>
              </div>
              <button type="button" data-action="clear" class="danger-action" title="この欄の文章をすべて消します">内容を消す</button>
            </div>
          </details>
        </div>
      </header>
      <textarea class="memo-editor" spellcheck="true" aria-label="文章入力"></textarea>
      <footer class="pane-footer">
        <span class="paragraph-count"></span>
        <span class="stat-divider" aria-hidden="true">·</span>
        <span class="char-count"></span>
      </footer>
      <button type="button" class="resize-handle desktop-only" aria-label="欄幅を調整"></button>
    </section>
  </template>

  <div id="shortcutPalette" class="shortcut-palette" hidden aria-hidden="true">
    <div class="shortcut-card" role="dialog" aria-modal="false" aria-labelledby="shortcutTitle">
      <div class="shortcut-head">
        <strong id="shortcutTitle">MultiMemos操作</strong>
        <span><kbd>Esc</kbd> 閉じる</span>
      </div>
      <div class="shortcut-grid">
        <section class="shortcut-group">
          <span class="shortcut-label">Pane</span>
          <div class="shortcut-list">
            <button class="shortcut-item" type="button" data-palette-pane="0"><span>欄1へ移動</span><kbd>1</kbd></button>
            <button class="shortcut-item" type="button" data-palette-pane="1"><span>欄2へ移動</span><kbd>2</kbd></button>
            <button class="shortcut-item" type="button" data-palette-pane="2"><span>欄3へ移動</span><kbd>3</kbd></button>
            <button class="shortcut-item" type="button" data-palette-pane="3"><span>欄4へ移動</span><kbd>4</kbd></button>
          </div>
        </section>
        <section class="shortcut-group">
          <span class="shortcut-label">Current pane</span>
          <div class="shortcut-list">
            <button class="shortcut-item" type="button" data-palette-action="copy"><span>全文コピー</span><kbd>C</kbd></button>
            <button class="shortcut-item" type="button" data-palette-action="focus"><span>集中表示 / 戻る</span><kbd>F</kbd></button>
            <button class="shortcut-item" type="button" data-palette-action="lock"><span>固定 / 固定解除</span><kbd>L</kbd></button>
          </div>
        </section>
        <section class="shortcut-group">
          <span class="shortcut-label">Layout</span>
          <div class="shortcut-list">
            <button class="shortcut-item" type="button" data-palette-layout="2"><span>2欄表示</span><kbd>⇧ 2</kbd></button>
            <button class="shortcut-item" type="button" data-palette-layout="3"><span>3欄表示</span><kbd>⇧ 3</kbd></button>
            <button class="shortcut-item" type="button" data-palette-layout="4"><span>4欄表示</span><kbd>⇧ 4</kbd></button>
          </div>
        </section>
        <section class="shortcut-group">
          <span class="shortcut-label">Workspace</span>
          <div class="shortcut-list">
            <button class="shortcut-item" type="button" data-palette-action="settings"><span>表示設定</span><kbd>S</kbd></button>
            <button class="shortcut-item" type="button" data-palette-action="equalize"><span>欄幅を均等にする</span><kbd>E</kbd></button>
            <button class="shortcut-item" type="button" data-palette-action="next"><span>前 / 次の欄へ</span><kbd>← →</kbd></button>
          </div>
        </section>
      </div>
      <div class="shortcut-note">
        <span><kbd>Ctrl M</kbd> でMultiMemosモード</span>
        <span>QuicklinksのAlt系とは分離</span>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite" aria-atomic="true" hidden></div>

  <script src="./app.js?v=20260814-8"></script>
  <script>
    (() => {
      const workspace = document.querySelector("#workspace");
      const palette = document.querySelector("#shortcutPalette");
      const trigger = document.querySelector("#shortcutTrigger");
      let lastPaneIndex = 0;

      const panes = () => [...workspace.querySelectorAll(".memo-pane")];
      const clampIndex = (index) => Math.max(0, Math.min(index, Math.max(0, panes().length - 1)));

      const currentPane = () => {
        const active = document.activeElement?.closest?.(".memo-pane");
        if (active) {
          const index = panes().indexOf(active);
          if (index >= 0) lastPaneIndex = index;
          return active;
        }
        return panes()[clampIndex(lastPaneIndex)] || null;
      };

      const rememberPane = (target) => {
        const pane = target.closest?.(".memo-pane");
        if (!pane) return;
        const index = panes().indexOf(pane);
        if (index >= 0) lastPaneIndex = index;
      };

      const syncPalette = () => {
        const rendered = panes();
        document.querySelectorAll("[data-palette-pane]").forEach((button) => {
          const index = Number(button.dataset.palettePane);
          const pane = rendered[index];
          const title = pane?.querySelector(".pane-title")?.value?.trim();
          button.disabled = !pane;
          button.querySelector("span").textContent = pane ? `${title || `欄${index + 1}`}へ移動` : `欄${index + 1}（非表示）`;
        });
      };

      const openPalette = () => {
        syncPalette();
        palette.hidden = false;
        palette.setAttribute("aria-hidden", "false");
        trigger?.setAttribute("aria-expanded", "true");
        document.querySelector("#settingsPanel")?.setAttribute("hidden", "");
        document.querySelector("#settingsToggle")?.setAttribute("aria-expanded", "false");
        document.querySelector("#settingsToggle")?.classList.remove("active");
        palette.querySelector(".shortcut-item:not(:disabled)")?.focus();
      };

      const closePalette = (restoreFocus = true) => {
        palette.hidden = true;
        palette.setAttribute("aria-hidden", "true");
        trigger?.setAttribute("aria-expanded", "false");
        if (restoreFocus) currentPane()?.querySelector(".memo-editor")?.focus();
      };

      const togglePalette = () => palette.hidden ? openPalette() : closePalette();

      const focusPane = (index) => {
        const list = panes();
        const pane = list[index];
        if (!pane) return;
        lastPaneIndex = index;
        closePalette(false);
        pane.querySelector(".memo-editor")?.focus();
        if (matchMedia("(max-width:800px)").matches) {
          pane.scrollIntoView({ behavior: "smooth", block: "nearest", inline: "center" });
        }
      };

      const runPaneAction = (action) => {
        const pane = currentPane();
        if (!pane) return;
        if (action === "copy") pane.querySelector('[data-action="copy"]')?.click();
        if (action === "focus") pane.querySelector('[data-action="focus"]')?.click();
        if (action === "lock") pane.querySelector('[data-action="lock"]')?.click();
      };

      const runGlobalAction = (action) => {
        if (action === "settings") document.querySelector("#settingsToggle")?.click();
        if (action === "equalize") document.querySelector("#equalize")?.click();
      };

      const movePane = (direction) => {
        const list = panes();
        if (!list.length) return;
        const active = currentPane();
        const activeIndex = Math.max(0, list.indexOf(active));
        focusPane(Math.max(0, Math.min(activeIndex + direction, list.length - 1)));
      };

      trigger?.addEventListener("click", togglePalette);
      workspace.addEventListener("focusin", (event) => rememberPane(event.target));
      workspace.addEventListener("pointerdown", (event) => rememberPane(event.target));

      palette.addEventListener("click", (event) => {
        const paneButton = event.target.closest("[data-palette-pane]");
        if (paneButton && !paneButton.disabled) {
          focusPane(Number(paneButton.dataset.palettePane));
          return;
        }

        const layoutButton = event.target.closest("[data-palette-layout]");
        if (layoutButton) {
          closePalette(false);
          document.querySelector(`[data-layout="${layoutButton.dataset.paletteLayout}"]`)?.click();
          return;
        }

        const actionButton = event.target.closest("[data-palette-action]");
        if (!actionButton) return;
        const action = actionButton.dataset.paletteAction;
        closePalette(false);
        if (["copy", "focus", "lock"].includes(action)) runPaneAction(action);
        if (["settings", "equalize"].includes(action)) runGlobalAction(action);
        if (action === "next") movePane(1);
      });

      document.addEventListener("pointerdown", (event) => {
        if (!palette.hidden && !palette.contains(event.target) && event.target !== trigger && !trigger?.contains(event.target)) {
          closePalette(false);
        }
      });

      window.addEventListener("keydown", (event) => {
        const code = event.code;

        // MultiMemosはCtrl+Mを入口にする。QuicklinksのAlt系とは完全に分離。
        if (event.ctrlKey && !event.altKey && !event.metaKey && !event.shiftKey && code === "KeyM") {
          event.preventDefault();
          event.stopImmediatePropagation();
          togglePalette();
          return;
        }

        // app.jsに残る旧Alt+1〜4もここで無効化し、Alt系をQuicklinksへ譲る。
        if (event.altKey && !event.ctrlKey && !event.metaKey && !event.shiftKey && /^Digit[1-4]$/.test(code)) {
          event.stopImmediatePropagation();
          return;
        }

        if (palette.hidden) return;

        if (event.key === "Escape") {
          event.preventDefault();
          event.stopImmediatePropagation();
          closePalette();
          return;
        }

        if (event.shiftKey && /^Digit[2-4]$/.test(code)) {
          const layout = code.slice(-1);
          event.preventDefault();
          event.stopImmediatePropagation();
          closePalette(false);
          document.querySelector(`[data-layout="${layout}"]`)?.click();
          return;
        }

        if (!event.shiftKey && /^Digit[1-4]$/.test(code)) {
          event.preventDefault();
          event.stopImmediatePropagation();
          focusPane(Number(code.slice(-1)) - 1);
          return;
        }

        const paneActions = {
          KeyC: "copy",
          KeyF: "focus",
          KeyL: "lock",
        };
        if (paneActions[code]) {
          event.preventDefault();
          event.stopImmediatePropagation();
          closePalette(false);
          runPaneAction(paneActions[code]);
          return;
        }

        const globalActions = {
          KeyS: "settings",
          KeyE: "equalize",
        };
        if (globalActions[code]) {
          event.preventDefault();
          event.stopImmediatePropagation();
          closePalette(false);
          runGlobalAction(globalActions[code]);
          return;
        }

        if (code === "ArrowLeft" || code === "ArrowRight") {
          event.preventDefault();
          event.stopImmediatePropagation();
          closePalette(false);
          movePane(code === "ArrowLeft" ? -1 : 1);
        }
      }, true);
    })();
  </script>
</body>
</html>
