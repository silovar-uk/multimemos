<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="description" content="参考文やAI案を横に置いたまま、自分の文章を書ける2〜4列の軽量メモワークスペース。">
  <meta name="theme-color" content="#f4f2ed">
  <title>MultiMemos</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <strong>MultiMemos</strong>
        <span>SIDE-BY-SIDE WRITING DESK</span>
      </div>

      <div class="layout-switch" aria-label="列数">
        <button type="button" data-layout="2">2</button>
        <button type="button" data-layout="3">3</button>
        <button type="button" data-layout="4">4</button>
      </div>

      <div class="global-actions">
        <div class="font-switch" aria-label="全体文字サイズ">
          <button type="button" id="fontDown">A−</button>
          <span id="fontValue">13</span>
          <button type="button" id="fontUp">A+</button>
        </div>
        <button type="button" id="compactToggle">Compact</button>
        <button type="button" id="equalize">Equal</button>
      </div>
    </header>

    <nav class="mobile-pager" aria-label="列を移動">
      <button type="button" id="mobilePrev" aria-label="前の列">‹</button>
      <div><span id="mobileCount">1 / 3</span><strong id="mobileTitle"></strong></div>
      <button type="button" id="mobileNext" aria-label="次の列">›</button>
    </nav>

    <main id="workspace" class="workspace" aria-label="メモワークスペース"></main>

    <footer class="statusbar">
      <span id="saveState"><i></i> Saved locally</span>
      <span class="desktop-only">Alt + 1–4 で列へ移動 · Esc でFocus解除</span>
    </footer>
  </div>

  <template id="paneTemplate">
    <section class="memo-pane">
      <header class="pane-header">
        <div class="pane-heading">
          <span class="pane-eyebrow"></span>
          <input class="pane-title" type="text" aria-label="列タイトル">
        </div>
        <div class="pane-actions">
          <button type="button" data-action="lock" title="Reference mode">REF</button>
          <button type="button" data-action="smaller" title="文字を小さく">−</button>
          <span class="pane-font-value"></span>
          <button type="button" data-action="larger" title="文字を大きく">+</button>
          <button type="button" data-action="copy" title="全文コピー">⧉</button>
          <button type="button" data-action="focus" title="この列に集中">↗</button>
          <button type="button" data-action="clear" title="この列を空にする">×</button>
        </div>
      </header>
      <textarea class="memo-editor" spellcheck="true"></textarea>
      <footer class="pane-footer"><span class="paragraph-count"></span><span class="char-count"></span></footer>
      <button type="button" class="resize-handle desktop-only" aria-label="列幅を調整"></button>
    </section>
  </template>

  <script src="./app.js"></script>
</body>
</html>
